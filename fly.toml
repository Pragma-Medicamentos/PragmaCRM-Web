# fly.toml app configuration file generated for pragmacrm-web on 2026-10-13T11:16:35-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# VITE_SUPABASE_ANON_KEY, VITE_API_KEY y VITE_GOOGLE_MAPS_API_KEY no van aca: se pasan con
# --build-arg al deployar (ver README, seccion Despliegue).

app = 'pragmacrm-web'
primary_region = 'ord'

# SIGQUIT es el apagado ordenado de nginx; SIGINT (default de Fly) corta las conexiones abiertas.
kill_signal = 'SIGQUIT'

[build]
  dockerfile = 'Dockerfile'

[build.args]
  VITE_SUPABASE_URL = 'https://cxitkosbxlkvbphswujk.supabase.co'
  VITE_API_URL = 'https://api.pragmamed.com'
  VITE_UPLOAD_MAX_FILE_SIZE_MB = '100'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
